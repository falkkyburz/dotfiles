# vim: set foldmethod=marker foldlevel=0:

# {{{ monitor

# Primary monitor
monitor= eDP-1, preferred, auto, 1

# Secondary monitors
monitor = , preferred, auto, auto

# }}}

# {{{ variables


# }}}

# {{{ autostart

# System
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE XDG_SESSION_CLASS
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE XDG_SESSION_CLASS
exec-once = hypridle
exec-once = hyprpaper
exec-once = hyprsunset
exec-once = hyprpm reload
exec-once = hyprlauncher -d
exec-once = swaync
exec-once = swayosd-server
exec-once = blueman-applet
exec-once = systemctl --user start hyprpolkitagent.service
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = udiskie
exec-once = ~/.local/bin/battery_notify.sh
exec-once = ~/.local/bin/charger_notify.sh
exec-once = ~/.local/bin/run-minibar.sh
exec-once = sh -lc 'sleep 2; nautilus --gapplication-service >/dev/null 2>&1 &'
# Apps
exec-once = firefox
exec-once = [workspace 2 silent] kitty

# }}}

# {{{ env

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# }}}

# {{{ general

general {
    gaps_in = 5
    gaps_out = 10

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

xwayland {
  force_zero_scaling = true
}

# }}}

# {{{ decoration / animations

decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

# }}}

# {{{ misc

misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}

#  }}}

# {{{ input

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:escape
    kb_rules =

    repeat_rate = 35
    repeat_delay = 300

    follow_mouse = 2

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

gesture = 3, horizontal, workspace

# Example per-device config
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# }}}

# {{{ binds

$mainMod = SUPER

$menu = hyprlauncher
#$menu = env LD_LIBRARY_PATH=/home/falk/Work/hypr/hyprtoolkit/build /home/falk/.local/hypr-dev/bin/hyprlauncher

# Keybinds 
bindd = $mainMod,       return, Open terminal,             exec, kitty --directory "$(~/.local/bin/terminal-cwd.sh)"
bindd = $mainMod,       X,      Close active window,       killactive,
bindd = $mainMod,       M,      Close hyprland,            exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bindd = $mainMod,       E,      Open file explorer,        exec, thunar
bindd = $mainMod,       N,      Open NM Connection Editor, exec, nm-connection-editor
bindd = $mainMod SHIFT, N,      Open NM TUI,               exec, kitty --class kitty_nmtui --hold nmtui
bindd = $mainMod,       R,      Open Qalculate,            exec, qalculate-gtk
bindd = $mainMod,       O,      Show general status,       exec, kitty --class kitty_status sh -c ~/.local/bin/status_show.sh
bindd = $mainMod,       I,      Show network status,       exec, kitty --class kitty_nmcli nmcli
bindd = $mainMod,       B,      Open bluetooth manager,    exec, blueman-manager
bindd = $mainMod,       A,      Open audio manager,        exec, hyprpwcenter
bindd = $mainMod,       F,      Toggle floating window,    togglefloating,
bindd = $mainMod SHIFT, F,      Toggle full screen,        fullscreen,
bindd = $mainMod,       G,      Toggle grouping (tabbed),  togglegroup,
bindd = $mainMod SHIFT, G,      Add all windows to group,  exec, ~/.local/bin/workspace_to_group.sh
bindd = $mainMod,       tab,    Change tab in group,       changegroupactive, f
bindd = $mainMod,       space,  Open launcher,             exec, $menu
bindd = $mainMod,       P,      Toggle pseudo tiling,      pseudo, # dwindle
bindd = $mainMod,       J,      Toggle window splitting,   layoutmsg, togglesplit # dwindle
bindd = $mainMod,       H,      Open btop,                 exec, kitty --class kitty_btop --hold btop
bindd = $mainMod,       L,      Lock session,              exec, hyprlock
bindd = $mainMod SHIFT, L,      Open power menu,           exec, ~/.local/bin/power_menu.sh
bindd = $mainMod ALT,   I,      Toggle hypridle,           exec, ~/.local/bin/hypridle_toggle.sh
bindd = ,               Print,  Take screenshow,           exec, ~/.local/bin/screenshot.sh
bindd = $mainMod SHIFT, P,      Open power mode menu,      exec, ~/.local/bin/powerprofilesctl_menu.sh
bindd = $mainMod,       V,      Open clipboard history,    exec, ~/.local/bin/cliphist_show.sh
bindd = $mainMod,       K,      Show keybinds,             exec, ~/.local/bin/get_binds.sh | hyprlauncher --dmenu

# Move focus with mainMod + arrow keys
bindd = $mainMod,       left,   Move focus left,  movefocus, l
bindd = $mainMod,       right,  Move focus right, movefocus, r
bindd = $mainMod,       up,     Move focus up,    movefocus, u
bindd = $mainMod,       down,   Move focus down,  movefocus, d
bindd = $mainMod ALT,   H,      Move focus left,  movefocus, l
bindd = $mainMod ALT,   L,      Move focus right, movefocus, r
bindd = $mainMod ALT,   K,      Move focus up,    movefocus, u
bindd = $mainMod ALT,   J,      Move focus down,  movefocus, d

# Move window
bindd = $mainMod SHIFT, left,   Move window left,  movewindow, l
bindd = $mainMod SHIFT, right,  Move window right, movewindow, r
bindd = $mainMod SHIFT, up,     Move window up,    movewindow, u
bindd = $mainMod SHIFT, down,   Move window down,  movewindow, d

# Switch workspaces with mainMod + [0-9]
bindd = $mainMod, 1, Switch to workspace 1,  workspace, 1
bindd = $mainMod, 2, Switch to workspace 2,  workspace, 2
bindd = $mainMod, 3, Switch to workspace 3,  workspace, 3
bindd = $mainMod, 4, Switch to workspace 4,  workspace, 4
bindd = $mainMod, 5, Switch to workspace 5,  workspace, 5
bindd = $mainMod, 6, Switch to workspace 6,  workspace, 6
bindd = $mainMod, 7, Switch to workspace 7,  workspace, 7
bindd = $mainMod, 8, Switch to workspace 8,  workspace, 8
bindd = $mainMod, 9, Switch to workspace 9,  workspace, 9
bindd = $mainMod, 0, Switch to workspace 10, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bindd = $mainMod SHIFT, 1, Move to workspace 1,  movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Move to workspace 2,  movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Move to workspace 3,  movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Move to workspace 4,  movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Move to workspace 5,  movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Move to workspace 6,  movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Move to workspace 7,  movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Move to workspace 8,  movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Move to workspace 9,  movetoworkspace, 9
bindd = $mainMod SHIFT, 0, Move to workspace 10, movetoworkspace, 10

# Example special workspace (scratchpad)
bindd = $mainMod, S,       Toggle special workspace, togglespecialworkspace, magic
bindd = $mainMod SHIFT, S, Move to magic workspace,  movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bindd = $mainMod, mouse_down, Scroll workspaces, workspace, e+1
bindd = $mainMod, mouse_up,   Scroll workspaces, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
binddm = $mainMod, mouse:272, Move with mouse,   movewindow
binddm = $mainMod, mouse:273, Resize with mouse, resizewindow

# Laptop multimedia keys for volume and LCD brightness
binddel = ,XF86AudioRaiseVolume,  Volume raise,       exec, swayosd-client --output-volume raise
binddel = ,XF86AudioLowerVolume,  Volume lower,       exec, swayosd-client --output-volume lower
binddel = ,XF86AudioMute,         Output mute toggle, exec, swayosd-client --output-volume mute-toggle
binddel = ,XF86AudioMicMute,      Input mute toggle,  exec, swayosd-client --input-volume mute-toggle
binddel = ,XF86MonBrightnessUp,   Brightness raise,   exec, swayosd-client --brightness raise
binddel = ,XF86MonBrightnessDown, Brightness lower,   exec, swayosd-client --brightness lower

# Requires playerctl
binddl = , XF86AudioNext,  Play next, exec, playerctl next
binddl = , XF86AudioPause, Pause,     exec, playerctl play-pause
binddl = , XF86AudioPlay,  Play,      exec, playerctl play-pause
binddl = , XF86AudioPrev,  Play prev, exec, playerctl previous

bindd = SUPER, equal, Stretch active window, resizeactive, 40 40
bindd = SUPER, minus, Contract active window, resizeactive, -40 -40

# }}}

# {{{ windowrules

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}

windowrule = match:class blueman-manager, float on, center on, size monitor_w*0.5 monitor_h*0.5
windowrule = match:class nm-connection-editor, float on, center on, size monitor_w*0.25 monitor_h*0.5
windowrule = match:class kitty_nmtui, float on, center on, size monitor_w*0.5 monitor_h*0.5
windowrule = match:class kitty_nmcli, float on, center on, size monitor_w*0.5 monitor_h*0.8
windowrule = match:class kitty_btop, float on, center on, size monitor_w*0.75 monitor_h*0.75
windowrule = match:class firefox, match:title Picture-in-Picture, float on, size monitor_w*0.25 monitor_h*0.25, pin on
windowrule = match:class localsend, float on, size monitor_w*0.25 monitor_h*0.5
windowrule = match:class com.gabm.satty, float on,
windowrule = match:class kitty_powerpofilesctl, float on, center on, size 400 100
windowrule = match:class kitty_cliphist_fzf, float on, center on, size monitor_w*0.6 monitor_h*0.6
windowrule = match:class kitty_status, float on, center on, size 350 170
windowrule = match:class qalculate-gtk, float on, center on, size monitor_w*0.5monitor_h*0.5
