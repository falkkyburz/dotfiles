[tasks."repos:hypr"]
description = "Clone optional Hypr development repositories using mise"
run = "mise -E hypr-dev bootstrap repos apply"

[tasks."repos:personal"]
description = "Clone personal development repositories using mise"
run = "mise -E personal bootstrap repos apply"

[tasks."build:hyprscreenpicker"]
description = "Build the custom picker against the installed Hypr libraries"
run = [
  'mise bootstrap repos apply --skip-dirty',
  'cmake -S "$HOME/dev/hyprscreenpicker" -B "$HOME/dev/hyprscreenpicker/build/release" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/.local"',
  'cmake --build "$HOME/dev/hyprscreenpicker/build/release" --parallel',
  'cmake --install "$HOME/dev/hyprscreenpicker/build/release"',
]
