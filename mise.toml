[bootstrap.hooks.pre-packages]
run = "bash scripts/prerequisites.sh"

[tasks.bootstrap]
description = "Complete system configuration after mise bootstrap installs packages and dotfiles"
run = ["bash scripts/configure.sh", "bash scripts/user-services.sh", "bash home/.local/bin/install-minibar-gpu"]

[tasks.apply]
description = "Apply dotfile symlinks without provisioning the system"
run = ["bash scripts/check-session.sh", "mise bootstrap dotfiles apply"]

[tasks.check]
description = "Validate shell scripts and isolated dotfile deployment"
run = "bash tests/bootstrap.sh"

[tasks.update-all]
description = 'Run full system update'
run = "yay -Syu --devel --answerclean A --answerdiff N --answeredit N"

# Groups are created before package installation. Membership is assigned
# to the invoking user by configure.sh (mise requires literal account names).

[bootstrap.groups.docker]
system = true

[bootstrap.groups.libvirt]
system = true

[bootstrap.groups.nordvpn]
system = true

[bootstrap.groups.wireshark]
system = true

[bootstrap.groups.uucp]
system = true

[bootstrap.user]
login_shell = "/usr/bin/zsh"

[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }
"~/dev/dotfiles-utils" = { url = "https://github.com/falkkyburz/dotfiles-utils.git" }
"~/dev/hyprscreenpicker" = { url = "https://github.com/falkkyburz/hyprscreenpicker.git" }

[bootstrap.files."/etc/udev/rules.d/99-serial.rules"]
source = "system/etc/udev/rules.d/99-serial.rules"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/modules-load.d/can.conf"]
source = "system/etc/modules-load.d/can.conf"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/systemd/system/vcan-interfaces.service"]
source = "system/etc/systemd/system/vcan-interfaces.service"
owner = "root"
group = "root"
mode = "0644"
notify = ["vcan-interfaces"]

[bootstrap.files."/etc/udev/rules.d/99-candlelight.rules"]
source = "system/etc/udev/rules.d/99-candlelight.rules"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/udev/rules.d/99-usb-sound.rules"]
source = "system/etc/udev/rules.d/99-usb-sound.rules"
owner = "root"
group = "root"
mode = "0644"
template = true

[bootstrap.files."/etc/udev/rules.d/99-ross-tech-hexv2.rules"]
source = "system/etc/udev/rules.d/99-ross-tech-hexv2.rules"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/NetworkManager/conf.d/wifi_backend.conf"]
source = "system/etc/NetworkManager/conf.d/wifi_backend.conf"
owner = "root"
group = "root"
mode = "0644"
notify = ["NetworkManager"]

[bootstrap.files."/etc/iwd/main.conf"]
source = "system/etc/iwd/main.conf"
owner = "root"
group = "root"
mode = "0644"
notify = ["iwd"]

[bootstrap.files."/etc/keyd/default.conf"]
source = "system/etc/keyd/default.conf"
owner = "root"
group = "root"
mode = "0644"
notify = ["keyd"]

[bootstrap.files."/etc/pam.d/login"]
source = "system/etc/pam.d/login"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/fonts/conf.d/70-no-bitmaps.conf"]
source = "/usr/share/fontconfig/conf.avail/70-no-bitmaps.conf"
owner = "root"
group = "root"
mode = "0644"
replace = true

[bootstrap.files."/etc/fonts/conf.d/10-scale-bitmap-fonts.conf"]
state = "absent"

[bootstrap.services.nftables]
state = "stopped"
enabled = false

[bootstrap.services.bluetooth]
state = "running"
enabled = true

[bootstrap.services.docker]
state = "running"
enabled = true

[bootstrap.services.libvirtd]
state = "running"
enabled = true

[bootstrap.services.nordvpnd]
state = "running"
enabled = true

[bootstrap.services.keyd]
state = "running"
enabled = true

[bootstrap.services.NetworkManager]
state = "running"
enabled = true

[bootstrap.services.iwd]
state = "running"
enabled = true

[bootstrap.services.vcan-interfaces]
state = "running"
enabled = true

