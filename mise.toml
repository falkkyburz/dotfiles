[dotfiles]
"~/.config" = { source = "home/.config", mode = "symlink-each" }
"~/.local/bin" = { source = "home/.local/bin", mode = "symlink-each" }
"~/.local/share" = { source = "home/.local/share", mode = "symlink-each", exclude = ["windows-docker"] }
"~/.local/share/windows-docker/compose.yml" = { source = "home/.local/share/windows-docker/compose.yml", mode = "copy" }
"~/.zshrc" = { source = "home/.zshrc", mode = "symlink" }
"~/.npmrc" = { source = "home/.npmrc", mode = "symlink" }

